<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Gradien Emas Elegan -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="40%" stop-color="#F5B83D"/>
      <stop offset="100%" stop-color="#C27803"/>
    </linearGradient>

    <!-- Gradien Navy Dalam -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132B4F"/>
      <stop offset="60%" stop-color="#0B1B33"/>
      <stop offset="100%" stop-color="#06101E"/>
    </linearGradient>

    <!-- Gradien Cyber Cyan Presensi -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gradien Emerald Hijau Kehadiran -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Bayangan Lembut -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00E5FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Lingkaran Luar Navy Elegan dengan List Emas -->
    <circle cx="80" cy="80" r="74" fill="url(#navyBg)" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Perisai Presisi Polri (Clean Shield) -->
    <path d="M 80 24 
             L 124 40 
             C 124 88 103 120 80 136 
             C 57 120 36 88 36 40 
             Z" 
          fill="url(#navyBg)" 
          stroke="url(#goldGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Bintang Tribrata Polri di Puncak Perisai -->
    <g transform="translate(80, 42)">
      <path d="M 0 -8 L 2.4 -2.6 L 8.2 -1.8 L 3.9 2.2 L 5 8 L 0 5.2 L -5 8 L -3.9 2.2 L -8.2 -1.8 L -2.4 -2.6 Z" 
            fill="url(#goldGrad)" 
            stroke="#FFF2A3" 
            stroke-width="0.5"/>
    </g>

    <!-- KOTAK BIDIKAN SCANNER BIOMETRIK (Face ID Reticle) -->
    <!-- Sudut Kiri Atas -->
    <path d="M 54 68 L 54 58 A 4 4 0 0 1 58 54 L 68 54" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>
    <!-- Sudut Kanan Atas -->
    <path d="M 106 68 L 106 58 A 4 4 0 0 0 102 54 L 92 54" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>
    <!-- Sudut Kiri Bawah -->
    <path d="M 54 92 L 54 102 A 4 4 0 0 0 58 106 L 68 106" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>
    <!-- Sudut Kanan Bawah -->
    <path d="M 106 92 L 106 102 A 4 4 0 0 1 102 106 L 92 106" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>

    <!-- SILUET PERSONEL (Kepala & Bahu Modern) -->
    <!-- Kepala Personel -->
    <circle cx="80" cy="70" r="11" fill="url(#goldGrad)"/>
    <!-- Bahu Personel -->
    <path d="M 61 102 C 61 88 71 85 80 85 C 89 85 99 88 99 102" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round"/>

    <!-- LENCANA CENTANG KEHADIRAN (Attendance Verified Badge) -->
    <g transform="translate(98, 98)">
      <!-- Lingkaran Hijau Terang -->
      <circle cx="0" cy="0" r="11.5" fill="url(#emeraldGrad)" stroke="#0B1B33" stroke-width="2.5"/>
      <!-- Tanda Centang Putih Tebal -->
      <path d="M -4.5 0 L -1.5 3 L 5.5 -4" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="2.2" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
  </g>
</svg>
