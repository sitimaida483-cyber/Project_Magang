<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Gradien Emas Presisi Polri -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#F5B83D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Gradien Emas Kilau Terang -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Gradien Navy Polri Dalam -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163761"/>
      <stop offset="60%" stop-color="#0E223D"/>
      <stop offset="100%" stop-color="#071220"/>
    </linearGradient>

    <!-- Gradien Cyber Cyan TIK (Teknologi Informasi & Komunikasi) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gradien Emerald Hijau Verifikasi Presensi -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Bayangan Halus (Drop Shadow) -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00E5FF" flood-opacity="0.8"/>
    </filter>

    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Latar Lingkaran Bayangan Luar -->
  <g filter="url(#badgeShadow)">
    <!-- Cincin Luar Emas (Outer Ring) -->
    <circle cx="80" cy="80" r="74" fill="url(#goldGrad)" stroke="#FFE885" stroke-width="1.5"/>

    <!-- Lingkaran Navy Utama -->
    <circle cx="80" cy="80" r="68" fill="url(#navyBg)"/>

    <!-- Garis Orbit Digital Cyber TIK (Teknologi Informasi & Komunikasi) -->
    <circle cx="80" cy="80" r="64" fill="none" stroke="url(#cyanGrad)" stroke-width="1" stroke-dasharray="8 4 2 4" opacity="0.55"/>
    
    <!-- Titik Node Jaringan Sensor -->
    <circle cx="80" cy="16" r="2.5" fill="#00E5FF" filter="url(#glowCyan)"/>
    <circle cx="144" cy="80" r="2.5" fill="#00E5FF" filter="url(#glowCyan)"/>
    <circle cx="80" cy="144" r="2.5" fill="#00E5FF" filter="url(#glowCyan)"/>
    <circle cx="16" cy="80" r="2.5" fill="#00E5FF" filter="url(#glowCyan)"/>

    <!-- Perisai Utama Polri (Police Shield) -->
    <path d="M 80 34 
             L 118 48 
             C 118 84 102 114 80 128 
             C 58 114 42 84 42 48 
             Z" 
          fill="url(#navyBg)" 
          stroke="url(#goldShine)" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Lapisan Garis Dalam Perisai -->
    <path d="M 80 40 
             L 112 52 
             C 112 82 98 108 80 120 
             C 62 108 48 82 48 52 
             Z" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="1.2" 
          opacity="0.4"/>

    <!-- Bintang Tribrata Polri di Puncak Perisai -->
    <g transform="translate(80, 48)">
      <circle cx="0" cy="0" r="7" fill="#F5B83D" opacity="0.3" filter="url(#badgeShadow)"/>
      <path d="M 0 -8 L 2.4 -2.6 L 8.2 -1.8 L 3.9 2.2 L 5 8 L 0 5.2 L -5 8 L -3.9 2.2 L -8.2 -1.8 L -2.4 -2.6 Z" 
            fill="url(#goldShine)" stroke="#FFF2A3" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 0 -8 L 0 5.2 L -5 8 L 0 0 Z" fill="#FFF9C4" opacity="0.45"/>
    </g>

    <!-- ELEMEN PRESENSI BIOMETRIK DIGITAL (Face Scan & Verified Presence) -->
    <!-- 1. Sudut Bidikan Scanner Wajah (Biometric Face Reticle Target) -->
    <!-- Sudut Kiri Atas -->
    <path d="M 54 68 L 54 60 L 63 60" fill="none" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <!-- Sudut Kanan Atas -->
    <path d="M 106 68 L 106 60 L 97 60" fill="none" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <!-- Sudut Kiri Bawah -->
    <path d="M 54 94 L 54 102 L 63 102" fill="none" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <!-- Sudut Kanan Bawah -->
    <path d="M 106 94 L 106 102 L 97 102" fill="none" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>

    <!-- 2. Siluet Personel / Kepala & Bahu (Modern Outline) -->
    <!-- Kepala -->
    <circle cx="80" cy="74" r="10" fill="none" stroke="url(#goldShine)" stroke-width="2.2" filter="url(#badgeShadow)"/>
    <circle cx="80" cy="74" r="4" fill="url(#cyanGrad)" opacity="0.8"/>
    <!-- Bahu & Kerah -->
    <path d="M 62 101 C 62 89 71 86 80 86 C 89 86 98 89 98 101" 
          fill="none" 
          stroke="url(#goldShine)" 
          stroke-width="2.2" 
          stroke-linecap="round"/>

    <!-- 3. Garis Laser Pemindai Biometrik Presensi (Scanning Beam) -->
    <line x1="56" y1="78" x2="104" y2="78" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" opacity="0.9" filter="url(#glowCyan)"/>
    <!-- Titik Fokus Laser Tengah -->
    <circle cx="80" cy="78" r="2" fill="#FFFFFF" filter="url(#glowCyan)"/>

    <!-- 4. Lencana Centang Hijau Kehadiran (Attendance Verified Checkmark) -->
    <g transform="translate(97, 97)">
      <!-- Lingkaran Hijau Verified -->
      <circle cx="0" cy="0" r="8" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="1.4" filter="url(#glowGreen)"/>
      <!-- Tanda Centang Putih -->
      <path d="M -3.8 0 L -1.2 2.6 L 4.2 -2.8" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="1.8" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>

    <!-- 5. Pita Emas Presisi Bawah bertuliskan "PresTIK" -->
    <g transform="translate(0, 10)">
      <!-- Bayangan Pita -->
      <path d="M 44 120 L 116 120 L 110 133 L 50 133 Z" fill="#071220" opacity="0.6"/>
      <!-- Badan Pita Emas -->
      <path d="M 40 118 L 120 118 L 114 133 L 46 133 Z" 
            fill="url(#goldGrad)" 
            stroke="#FFF2A3" 
            stroke-width="1"
            stroke-linejoin="round"/>
      <!-- Aksen Lipatan Pita Kiri & Kanan -->
      <path d="M 40 124 L 46 133 L 46 118 Z" fill="#92400E" opacity="0.4"/>
      <path d="M 120 124 L 114 133 L 114 118 Z" fill="#92400E" opacity="0.4"/>
      <!-- Teks PresTIK -->
      <text x="80" y="129.5" 
            text-anchor="middle" 
            font-family="'Plus Jakarta Sans', Arial, sans-serif" 
            font-size="9" 
            font-weight="900" 
            letter-spacing="1.2" 
            fill="#091626">PresTIK</text>
    </g>
  </g>
</svg>
