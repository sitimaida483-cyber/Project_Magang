<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Gradien Emas Presisi Polri -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#F5B83D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Gradien Emas Kilau Terang -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Gradien Navy Polri Dalam -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163761"/>
      <stop offset="60%" stop-color="#0E223D"/>
      <stop offset="100%" stop-color="#071220"/>
    </linearGradient>

    <!-- Gradien Cyber Cyan TIK -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Bayangan Halus (Drop Shadow) -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00E5FF" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Latar Lingkaran Bayangan Luar -->
  <g filter="url(#badgeShadow)">
    <!-- Cincin Luar Emas (Outer Ring) -->
    <circle cx="80" cy="80" r="74" fill="url(#goldGrad)" stroke="#FFE885" stroke-width="1.5"/>

    <!-- Lingkaran Navy Utama -->
    <circle cx="80" cy="80" r="68" fill="url(#navyBg)"/>

    <!-- Garis Orbit Digital Cyber TIK (Teknologi Informasi & Komunikasi) -->
    <circle cx="80" cy="80" r="64" fill="none" stroke="url(#cyanGrad)" stroke-width="1" stroke-dasharray="8 4 2 4" opacity="0.6"/>
    
    <!-- Titik-Titik Node Jaringan / Satelit Komunikasi -->
    <circle cx="80" cy="16" r="2.5" fill="#00E5FF" filter="url(#glowCyan)"/>
    <circle cx="144" cy="80" r="2.5" fill="#00E5FF" filter="url(#glowCyan)"/>
    <circle cx="80" cy="144" r="2.5" fill="#00E5FF" filter="url(#glowCyan)"/>
    <circle cx="16" cy="80" r="2.5" fill="#00E5FF" filter="url(#glowCyan)"/>

    <!-- Gelombang Sinyal TIK (Kiri & Kanan Atas) -->
    <path d="M 52 50 A 42 42 0 0 1 108 50" fill="none" stroke="url(#cyanGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
    <path d="M 60 57 A 30 30 0 0 1 100 57" fill="none" stroke="url(#cyanGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

    <!-- Perisai Utama Polri (Police Shield) -->
    <!-- Bentuk Perisai Kokoh Bergradien Navy dengan Bingkai Emas -->
    <path d="M 80 34 
             L 118 48 
             C 118 84 102 114 80 128 
             C 58 114 42 84 42 48 
             Z" 
          fill="url(#navyBg)" 
          stroke="url(#goldShine)" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Lapisan Dalam Perisai -->
    <path d="M 80 40 
             L 112 52 
             C 112 82 98 108 80 120 
             C 62 108 48 82 48 52 
             Z" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="1.2" 
          opacity="0.5"/>

    <!-- Bintang Tribrata Emas (Police 5-Pointed Star) -->
    <g transform="translate(80, 52)">
      <!-- Sinar/Glow Bintang -->
      <circle cx="0" cy="0" r="10" fill="#F5B83D" opacity="0.25" filter="url(#badgeShadow)"/>
      <!-- Bintang Emas Bersegi -->
      <!-- Sisi Kiri Bintang (Bayangan) -->
      <path d="M 0 -11 L 3.2 -3.5 L 11 -2.5 L 5.5 3.2 L 6.8 11 L 0 7.2 L -6.8 11 L -5.5 3.2 L -11 -2.5 L -3.2 -3.5 Z" 
            fill="url(#goldShine)" stroke="#FFF2A3" stroke-width="0.75" stroke-linejoin="round"/>
      <!-- Aksen Cahaya Segi Bintang -->
      <path d="M 0 -11 L 0 7.2 L -6.8 11 L 0 0 Z" fill="#FFF9C4" opacity="0.5"/>
      <path d="M 0 -11 L 3.2 -3.5 L 0 0 Z" fill="#FFFDE7" opacity="0.7"/>
    </g>

    <!-- Simbol TIK & Presensi Digital: Sirkuit Komunikasi & Pemindai Sinyal -->
    <!-- Garis Sirkuit Vertikal & Horizontal -->
    <path d="M 80 66 L 80 94" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Sirkuit Cabang Kiri -->
    <path d="M 80 76 L 68 83 L 62 83" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="83" r="2.5" fill="#FFE885" stroke="#D97706" stroke-width="0.8"/>

    <!-- Sirkuit Cabang Kanan -->
    <path d="M 80 76 L 92 83 L 98 83" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="83" r="2.5" fill="#FFE885" stroke="#D97706" stroke-width="0.8"/>

    <!-- Titik Pusat Presensi / Core Pulse (Biometric / Radio Sensor Core) -->
    <circle cx="80" cy="94" r="5" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.2" filter="url(#glowCyan)"/>
    <circle cx="80" cy="94" r="2" fill="#0E223D"/>

    <!-- Pita / Banner Bawah "BID TIK" -->
    <g transform="translate(0, 10)">
      <!-- Bayangan Pita -->
      <path d="M 50 120 L 110 120 L 104 132 L 56 132 Z" fill="#071220" opacity="0.6"/>
      <!-- Badan Pita Emas -->
      <path d="M 46 118 L 114 118 L 108 132 L 52 132 Z" 
            fill="url(#goldGrad)" 
            stroke="#FFF2A3" 
            stroke-width="1"/>
      <!-- Teks BID TIK -->
      <text x="80" y="129" 
            text-anchor="middle" 
            font-family="'Plus Jakarta Sans', Arial, sans-serif" 
            font-size="9" 
            font-weight="900" 
            letter-spacing="1.5" 
            fill="#091626">BID TIK</text>
    </g>
  </g>
</svg>

